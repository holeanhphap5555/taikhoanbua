<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020008">
<title>Galaxy 3D — Dành cho em</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#loading{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;transition:opacity 1.5s}
#loading.hide{opacity:0;pointer-events:none}
.loading-title{font-size:11px;letter-spacing:7px;color:#aaa;margin-bottom:25px}
.loading-bar{width:180px;height:1px;background:#222;overflow:hidden}
.loading-progress{width:0;height:100%;background:#fff;box-shadow:0 0 12px #fff;transition:width .3s}
#intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none;transition:opacity 1.5s,transform 1.5s}
#intro.hide{opacity:0;transform:scale(1.25)}
.intro-small{font-size:11px;letter-spacing:8px;color:#aaa;margin-bottom:22px}
.intro-title{font-size:clamp(36px,8vw,90px);font-weight:200;letter-spacing:4px;text-shadow:0 0 15px #fff,0 0 45px #c864ff,0 0 100px #6496ff}
.intro-sub{margin-top:20px;font-size:clamp(11px,2vw,16px);letter-spacing:4px;color:#999}
#start{position:absolute;z-index:50;left:50%;bottom:45px;transform:translateX(-50%);padding:13px 28px;border:1px solid #777;border-radius:50px;background:#ffffff0d;color:#fff;font-size:11px;letter-spacing:4px;cursor:pointer;backdrop-filter:blur(12px);transition:.4s}
#start:hover{background:#ffffff20;border-color:#fff;box-shadow:0 0 25px #b464ff66;transform:translateX(-50%) scale(1.06)}
#start.hide{opacity:0;pointer-events:none}
#sound{position:absolute;z-index:80;top:18px;right:20px;width:42px;height:42px;border:1px solid #ffffff33;border-radius:50%;background:#0004;color:#fff;cursor:pointer;backdrop-filter:blur(10px)}
#message{position:absolute;z-index:30;left:50%;bottom:9%;width:min(90%,850px);transform:translateX(-50%) translateY(20px);text-align:center;opacity:0;pointer-events:none;transition:opacity 2s,transform 2s}
#message.show{opacity:1;transform:translateX(-50%)}
.message-small{font-size:10px;letter-spacing:6px;color:#999;margin-bottom:15px}
#message h1{font-size:clamp(34px,7vw,80px);font-weight:200;line-height:1.05;text-shadow:0 0 15px #fff,0 0 35px #ff64d8cc,0 0 80px #6482ffb3}
#message p{margin-top:18px;font-size:clamp(12px,2vw,18px);letter-spacing:2px;color:#ccc}
#final{position:absolute;inset:0;z-index:40;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;opacity:0;pointer-events:none;background:radial-gradient(circle,#8246ff14,transparent 55%);transition:opacity 2.5s}
#final.show{opacity:1}
#final h2{font-size:clamp(42px,10vw,110px);font-weight:200;letter-spacing:5px;text-shadow:0 0 15px #fff,0 0 45px #ff64d8e6,0 0 100px #5a82ffcc;animation:pulse 4s ease-in-out infinite}
#final p{margin-top:20px;font-size:clamp(12px,2vw,18px);letter-spacing:4px;color:#bbb}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media(max-width:600px){.intro-small{letter-spacing:4px}.intro-title{font-size:42px}.intro-sub{max-width:280px;line-height:1.7}#sound{top:12px;right:12px;width:38px;height:38px}#start{bottom:30px;padding:12px 22px;font-size:10px}#message{bottom:12%}.message-small{font-size:8px;letter-spacing:4px}#message h1{font-size:36px}#message p{font-size:12px;line-height:1.7}#final h2{font-size:48px}}
</style>
</head>
<body>
<div id="app">
<div id="loading"><div class="loading-title">ENTERING THE UNIVERSE</div><div class="loading-bar"><div class="loading-progress" id="loadingProgress"></div></div></div>
<div id="intro"><div class="intro-small">A LITTLE UNIVERSE</div><div class="intro-title">Dành cho em</div><div class="intro-sub">Có một điều anh muốn em nhìn thấy...</div></div>
<button id="sound">🔇</button>
<button id="start">✦ BẮT ĐẦU ✦</button>
<div id="message"><div class="message-small">SOMEWHERE IN THIS UNIVERSE</div><h1>Em là điều đặc biệt nhất.</h1><p>Giữa hàng triệu vì sao, anh vẫn tìm thấy em.</p></div>
<div id="final"><h2>Thương em ❤️</h2><p>Một chút vũ trụ dành riêng cho em.</p></div>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const app=document.getElementById("app");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000002);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,3000);
camera.position.set(0,5,45);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
app.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,.15));
const pinkLight=new THREE.PointLight(0xff65d8,15,100);
pinkLight.position.set(5,4,3);
scene.add(pinkLight);
const blueLight=new THREE.PointLight(0x638cff,12,100);
blueLight.position.set(-6,-3,5);
scene.add(blueLight);

/* STARFIELD */
const starCount=innerWidth<600?4500:9000;
const starPositions=new Float32Array(starCount*3);
const starColors=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
 const r=100+Math.random()*1100;
 const theta=Math.random()*Math.PI*2;
 const phi=Math.acos(2*Math.random()-1);
 starPositions[i*3]=r*Math.sin(phi)*Math.cos(theta);
 starPositions[i*3+1]=r*Math.cos(phi);
 starPositions[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
 const c=new THREE.Color();
 const t=Math.random();
 if(t<.55)c.setHSL(.62+Math.random()*.08,.7,.75);
 else if(t<.8)c.setHSL(.86+Math.random()*.08,.75,.8);
 else c.setHSL(.12+Math.random()*.08,.7,.85);
 starColors[i*3]=c.r;starColors[i*3+1]=c.g;starColors[i*3+2]=c.b;
}
const starGeometry=new THREE.BufferGeometry();
starGeometry.setAttribute("position",new THREE.BufferAttribute(starPositions,3));
starGeometry.setAttribute("color",new THREE.BufferAttribute(starColors,3));
const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({size:.75,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(stars);

/* NEBULA */
const nebulaCount=innerWidth<600?1000:2200;
const nebulaPositions=new Float32Array(nebulaCount*3);
const nebulaColors=new Float32Array(nebulaCount*3);
for(let i=0;i<nebulaCount;i++){
 const a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.65)*70;
 nebulaPositions[i*3]=Math.cos(a)*r;
 nebulaPositions[i*3+1]=(Math.random()-.5)*18;
 nebulaPositions[i*3+2]=Math.sin(a)*r;
 const c=new THREE.Color();
 c.setHSL((Math.random()>.5?.82:.55)+(Math.random()-.5)*.08,.85,.55);
 nebulaColors[i*3]=c.r;nebulaColors[i*3+1]=c.g;nebulaColors[i*3+2]=c.b;
}
const ng=new THREE.BufferGeometry();
ng.setAttribute("position",new THREE.BufferAttribute(nebulaPositions,3));
ng.setAttribute("color",new THREE.BufferAttribute(nebulaColors,3));
const nebula=new THREE.Points(ng,new THREE.PointsMaterial({size:.55,vertexColors:true,transparent:true,opacity:.25,depthWrite:false,blending:THREE.AdditiveBlending}));
nebula.rotation.x=Math.PI*.35;
scene.add(nebula);

/* PLANET */
const planetGroup=new THREE.Group();
scene.add(planetGroup);
const planet=new THREE.Mesh(new THREE.SphereGeometry(6,96,96),new THREE.MeshStandardMaterial({color:0xb77aff,roughness:.25,metalness:.1,emissive:0x542c89,emissiveIntensity:.7}));
planetGroup.add(planet);
const cloud=new THREE.Mesh(new THREE.SphereGeometry(6.15,64,64),new THREE.MeshBasicMaterial({color:0xffa8e9,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,side:THREE.BackSide}));
planetGroup.add(cloud);
const planetGlow=new THREE.Mesh(new THREE.SphereGeometry(7.5,64,64),new THREE.MeshBasicMaterial({color:0xff68d7,transparent:true,opacity:.07,blending:THREE.AdditiveBlending,side:THREE.BackSide}));
planetGroup.add(planetGlow);

/* ORBITS */
const orbitGroup=new THREE.Group();
planetGroup.add(orbitGroup);
function orbit(radius,tube,color,rotation){
 const m=new THREE.Mesh(new THREE.TorusGeometry(radius,tube,12,240),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7,blending:THREE.AdditiveBlending}));
 m.rotation.set(rotation.x,rotation.y,rotation.z);
 orbitGroup.add(m);
 return m;
}
const orbit1=orbit(9,.025,0xffffff,{x:.8,y:.25,z:.15});
const orbit2=orbit(11,.018,0xff79df,{x:1.15,y:-.4,z:.3});
const orbit3=orbit(13,.014,0x75a5ff,{x:.35,y:.9,z:-.2});

const orbitParticles=[];
for(let i=0;i<70;i++){
 const p=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.08,8,8),new THREE.MeshBasicMaterial({color:i%2?0xff9ee8:0x9ec9ff}));
 p.userData={angle:Math.random()*Math.PI*2,radius:8.5+Math.random()*5,speed:.15+Math.random()*.4,height:(Math.random()-.5)*3};
 orbitGroup.add(p);orbitParticles.push(p);
}

/* 3D PHOTOS — thay link bằng ảnh của bạn */
const photoURLs=[
"https://i.pravatar.cc/300?img=47",
"https://i.pravatar.cc/300?img=32",
"https://i.pravatar.cc/300?img=44",
"https://i.pravatar.cc/300?img=45",
"https://i.pravatar.cc/300?img=49",
"https://i.pravatar.cc/300?img=43",
"https://i.pravatar.cc/300?img=48",
"https://i.pravatar.cc/300?img=25",
"https://i.pravatar.cc/300?img=23",
"https://i.pravatar.cc/300?img=31"
];
const loader=new THREE.TextureLoader();
const photoGroup=new THREE.Group();
scene.add(photoGroup);
const photos=[];
photoURLs.forEach((url,index)=>{
 loader.load(url,texture=>{
  texture.colorSpace=THREE.SRGBColorSpace;
  const photo=new THREE.Mesh(new THREE.PlaneGeometry(3.2,4.1),new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide}));
  const angle=index/photoURLs.length*Math.PI*2;
  const radius=17+Math.random()*8;
  photo.position.set(Math.cos(angle)*radius,(Math.random()-.5)*10,Math.sin(angle)*radius);
  photo.userData={angle,radius,speed:.05+Math.random()*.08,baseY:photo.position.y,phase:Math.random()*10};
  photoGroup.add(photo);photos.push(photo);
 });
});

/* PARTICLES */
const particleGroup=new THREE.Group();
scene.add(particleGroup);
for(let i=0;i<120;i++){
 const p=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.08,6,6),new THREE.MeshBasicMaterial({color:Math.random()>.5?0xffffff:0xff83e4,transparent:true,opacity:.3+Math.random()*.7}));
 const a=Math.random()*Math.PI*2,r=8+Math.random()*25;
 p.position.set(Math.cos(a)*r,(Math.random()-.5)*20,Math.sin(a)*r);
 p.userData={a,r,s:.1+Math.random()*.4,phase:Math.random()*6};
 particleGroup.add(p);
}

/* CAMERA */
let mouseX=0,mouseY=0,targetX=0,targetY=0;
addEventListener("mousemove",e=>{targetX=e.clientX/innerWidth-.5;targetY=e.clientY/innerHeight-.5});
addEventListener("touchmove",e=>{if(e.touches.length){targetX=e.touches[0].clientX/innerWidth-.5;targetY=e.touches[0].clientY/innerHeight-.5}},{passive:true});

let started=false,elapsed=0,finalStarted=false;
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();elapsed+=dt;
 mouseX+=(targetX-mouseX)*.035;mouseY+=(targetY-mouseY)*.035;

 stars.rotation.y+=dt*.003;stars.rotation.x+=dt*.0007;
 nebula.rotation.z+=dt*.003;nebula.rotation.y-=dt*.001;
 planet.rotation.y+=dt*.08;cloud.rotation.y-=dt*.035;
 planetGlow.scale.setScalar(1+Math.sin(elapsed*1.5)*.025);

 orbit1.rotation.z+=dt*.25;
 orbit2.rotation.z-=dt*.18;
 orbit3.rotation.z+=dt*.12;

 orbitParticles.forEach(p=>{
  const d=p.userData;d.angle+=dt*d.speed;
  p.position.x=Math.cos(d.angle)*d.radius;
  p.position.z=Math.sin(d.angle)*d.radius;
  p.position.y=d.height+Math.sin(elapsed*1.5+d.angle)*.5;
 });

 photos.forEach(p=>{
  const d=p.userData;d.angle+=dt*d.speed;
  p.position.x=Math.cos(d.angle)*d.radius;
  p.position.z=Math.sin(d.angle)*d.radius;
  p.position.y=d.baseY+Math.sin(elapsed+d.phase)*1.5;
  p.lookAt(camera.position);
 });

 particleGroup.children.forEach(p=>{
  const d=p.userData;d.a+=dt*d.s;
  p.position.x=Math.cos(d.a)*d.r;
  p.position.z=Math.sin(d.a)*d.r;
  p.position.y+=Math.sin(elapsed*2+d.phase)*.004;
 });

 if(!started){
  camera.position.x=Math.sin(elapsed*.15)*2;
  camera.position.y=5+Math.sin(elapsed*.3);
  camera.position.z=45;
 }else{
  const cx=mouseX*8,cy=5-mouseY*5;
  const cz=elapsed>15?17:elapsed>11?22:elapsed>5?27:32;
  camera.position.x+=(cx-camera.position.x)*.015;
  camera.position.y+=(cy-camera.position.y)*.015;
  camera.position.z+=(cz-camera.position.z)*.01;
 }
 camera.lookAt(0,0,0);

 if(started&&elapsed>17&&!finalStarted){
  finalStarted=true;
  document.getElementById("final").classList.add("show");
 }
 renderer.render(scene,camera);
}
animate();

/* START */
const start=document.getElementById("start");
start.addEventListener("click",()=>{
 if(started)return;
 started=true;elapsed=0;
 start.classList.add("hide");
 document.getElementById("intro").classList.add("hide");
 startAudio();
 setTimeout(()=>document.getElementById("message").classList.add("show"),7500);
 setTimeout(()=>document.getElementById("message").classList.remove("show"),14500);
});

/* AUDIO */
let audioContext=null,masterGain=null,muted=false;
function startAudio(){
 if(audioContext)return;
 try{
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioContext.createGain();masterGain.gain.value=.025;masterGain.connect(audioContext.destination);
  [261.63,329.63,392,493.88,523.25].forEach((frequency,index)=>{
   const osc=audioContext.createOscillator(),gain=audioContext.createGain();
   osc.type="sine";osc.frequency.value=frequency;gain.gain.value=0;
   osc.connect(gain);gain.connect(masterGain);osc.start();
   gain.gain.linearRampToValueAtTime(.025,audioContext.currentTime+2+index*.4);
   gain.gain.linearRampToValueAtTime(0,audioContext.currentTime+25);
   osc.stop(audioContext.currentTime+26);
  });
 }catch(e){console.log("Audio unavailable",e)}
}
document.getElementById("sound").addEventListener("click",()=>{
 if(!audioContext){startAudio();document.getElementById("sound").textContent="🔊";return}
 muted=!muted;masterGain.gain.value=muted?0:.025;
 document.getElementById("sound").textContent=muted?"🔇":"🔊";
});

/* RESIZE */
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
});

/* LOADING */
const progress=document.getElementById("loadingProgress"),loading=document.getElementById("loading");
let load=0;
const timer=setInterval(()=>{
 load+=Math.random()*12;
 if(load>=100){load=100;clearInterval(timer);progress.style.width="100%";setTimeout(()=>loading.classList.add("hide"),600)}
 else progress.style.width=load+"%";
},180);
</script>
</body>
</html>
