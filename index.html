<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký tài khoản bựa 🤡</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#111827,#312e81,#7c3aed);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#172033;
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    background:#fff;
    border-radius:28px;
    padding:30px;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:5px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:900;
}

.sub{
    text-align:center;
    color:#6b7280;
    font-size:14px;
    margin:8px 0 25px;
}

.group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:800;
    font-size:14px;
    margin-bottom:7px;
}

.input{
    width:100%;
    padding:13px 15px;
    border:2px solid #e5e7eb;
    border-radius:14px;
    font-size:15px;
    outline:none;
    background:#fff;
    transition:.2s;
}

.input:focus{
    border-color:#7c3aed;
    box-shadow:0 0 0 4px rgba(124,58,237,.1);
}

textarea.input{
    min-height:100px;
    resize:vertical;
}

.age-note{
    display:none;
    margin-top:7px;
    color:#dc2626;
    font-size:13px;
    font-weight:800;
}

.password-box{
    position:relative;
}

.password-box .input{
    padding-right:50px;
}

.show-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    font-size:18px;
    cursor:pointer;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.btn{
    border:0;
    border-radius:15px;
    padding:14px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.register-btn{
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    color:#fff;
}

.login-btn{
    background:#111827;
    color:#fff;
}

.full-btn{
    width:100%;
    margin-top:20px;
}

.message{
    min-height:22px;
    margin-top:15px;
    text-align:center;
    font-size:14px;
    font-weight:800;
    line-height:1.5;
    white-space:pre-line;
}

.note{
    text-align:center;
    color:#9ca3af;
    font-size:11px;
    margin-top:16px;
    line-height:1.5;
}

.back{
    width:100%;
    border:0;
    background:none;
    color:#7c3aed;
    font-weight:800;
    font-size:13px;
    margin-top:16px;
    cursor:pointer;
}

@media(max-width:480px){

    .card{
        padding:22px;
        border-radius:22px;
    }

    .title{
        font-size:24px;
    }

    .buttons{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">🤡</div>

<h1 class="title" id="pageTitle">
Đăng ký tài khoản
</h1>

<p class="sub" id="pageSub">
Tạo tài khoản thật theo phong cách không giống ai.
</p>


<!-- ==================== TRANG ĐĂNG KÝ ==================== -->

<div id="registerPage">

<div class="group">

<label for="username">
🪪 Tên tài khoản
</label>

<input
    class="input"
    id="username"
    type="text"
    autocomplete="username"
    placeholder="Ví dụ: phap123"
>

</div>


<div class="group">

<label for="password">
🔐 Mật khẩu
</label>

<div class="password-box">

<input
    class="input"
    id="password"
    type="password"
    autocomplete="new-password"
    placeholder="Ít nhất 6 ký tự"
>

<button
    class="show-password"
    type="button"
    onclick="toggleRegisterPassword()"
    id="registerEye"
>
👁️
</button>

</div>

</div>


<div class="group">

<label for="email">
📧 Email
</label>

<input
    class="input"
    id="email"
    type="email"
    autocomplete="email"
    placeholder="example@gmail.com"
>

</div>


<div class="group">

<label for="phone">
📱 Số điện thoại
</label>

<input
    class="input"
    id="phone"
    type="tel"
    autocomplete="tel"
    placeholder="Nhập số điện thoại"
>

</div>


<div class="group">

<label for="age">
🎂 Tuổi
</label>

<input
    class="input"
    id="age"
    type="number"
    min="1"
    max="120"
    placeholder="Nhập tuổi"
>

<p
    class="age-note"
    id="ageNote"
>
Tuổi x đã tồn tại, vui lòng chọn tuổi khác.
</p>

</div>


<div class="group">

<label for="note">
📝 Ghi chú
</label>

<textarea
    class="input"
    id="note"
    placeholder="Ghi chú của bạn..."
></textarea>

</div>


<div class="buttons">

<button
    class="btn register-btn"
    type="button"
    onclick="register()"
>
🔥 ĐĂNG KÝ
</button>

<button
    class="btn login-btn"
    type="button"
    onclick="showLogin()"
>
🔑 ĐĂNG NHẬP
</button>

</div>

</div>


<!-- ==================== TRANG ĐĂNG NHẬP ==================== -->

<div id="loginPage" style="display:none;">

<div class="group">

<label for="loginUsername">
🪪 Tên tài khoản
</label>

<input
    class="input"
    id="loginUsername"
    type="text"
    autocomplete="username"
    placeholder="Nhập tên tài khoản"
>

</div>


<div class="group">

<label for="loginPassword">
🔐 Mật khẩu
</label>

<div class="password-box">

<input
    class="input"
    id="loginPassword"
    type="password"
    autocomplete="current-password"
    placeholder="Nhập mật khẩu"
>

<button
    class="show-password"
    type="button"
    onclick="toggleLoginPassword()"
    id="loginEye"
>
👁️
</button>

</div>

</div>


<button
    class="btn login-btn full-btn"
    type="button"
    onclick="login()"
>
🔑 ĐĂNG NHẬP
</button>


<button
    class="back"
    type="button"
    onclick="showRegister()"
>
← Quay lại trang đăng ký
</button>

</div>


<div
    id="message"
    class="message"
></div>



</div>

</div>


<script>

/* ==================== HIỂN THỊ THÔNG BÁO ==================== */

function showMessage(text,type="error"){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.color =
        type === "success"
        ? "#16a34a"
        : "#dc2626";
}


/* ==================== TUỔI ==================== */

const ageInput =
    document.getElementById("age");

const ageNote =
    document.getElementById("ageNote");


/*
Khi đang nhập tuổi:
Không hiện thông báo.
*/

ageInput.addEventListener("input",function(){

    ageNote.style.display = "none";

});


/*
Khi rời khỏi ô tuổi:
Hiện thông báo với tuổi người dùng nhập.
*/

ageInput.addEventListener("blur",function(){

    const age =
        this.value.trim();

    if(age){

        ageNote.textContent =
            `Tuổi ${age} đã tồn tại, vui lòng chọn tuổi khác.`;

        ageNote.style.display = "block";

    }else{

        ageNote.style.display = "none";

    }

});


/* ==================== ĐĂNG KÝ ==================== */

function register(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const phone =
        document
        .getElementById("phone")
        .value
        .trim();

    const age =
        Number(
            document
            .getElementById("age")
            .value
        );


    if(
        !username ||
        !password ||
        !email ||
        !phone ||
        !age
    ){

        showMessage(
            "⚠️ Vui lòng nhập đầy đủ thông tin!"
        );

        return;
    }


    if(username.length < 3){

        showMessage(
            "⚠️ Tên tài khoản phải có ít nhất 3 ký tự!"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "🔐 Mật khẩu phải có ít nhất 6 ký tự!"
        );

        return;
    }


    const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(!emailRegex.test(email)){

        showMessage(
            "📧 Email không hợp lệ!"
        );

        return;
    }


    const phoneRegex =
        /^0\d{9,10}$/;


    if(!phoneRegex.test(phone)){

        showMessage(
            "📱 Số điện thoại không hợp lệ!"
        );

        return;
    }


    if(age < 1 || age > 120){

        showMessage(
            "🎂 Tuổi phải từ 1 đến 120!"
        );

        return;
    }


    showMessage(
        `❌ KHÔNG THỂ TẠO TÀI KHOẢN!

Tuổi ${age} đã tồn tại, vui lòng chọn tuổi khác.`
    );

}


/* ==================== ĐĂNG NHẬP ==================== */

function login(){

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if(!username || !password){

        showMessage(
            "⚠️ Vui lòng nhập tên tài khoản và mật khẩu!"
        );

        return;
    }


    showMessage(
        "❌ Đăng nhập thất bại!\n\nKhông tìm thấy tài khoản nào trong hệ thống. 🤡"
    );

}


/* ==================== CHUYỂN TRANG ĐĂNG NHẬP ==================== */

function showLogin(){

    document
        .getElementById("registerPage")
        .style.display = "none";

    document
        .getElementById("loginPage")
        .style.display = "block";


    document
        .getElementById("pageTitle")
        .textContent = "Đăng nhập";


    document
        .getElementById("pageSub")
        .textContent =
        "Chào mừng bạn quay lại với hệ thống.";


    document
        .getElementById("message")
        .textContent = "";

}


/* ==================== QUAY LẠI ĐĂNG KÝ ==================== */

function showRegister(){

    document
        .getElementById("loginPage")
        .style.display = "none";

    document
        .getElementById("registerPage")
        .style.display = "block";


    document
        .getElementById("pageTitle")
        .textContent =
        "Đăng ký tài khoản";


    document
        .getElementById("pageSub")
        .textContent =
        "Tạo tài khoản thật theo phong cách không giống ai.";


    document
        .getElementById("message")
        .textContent = "";

}


/* ==================== HIỆN / ẨN MẬT KHẨU ĐĂNG KÝ ==================== */

function toggleRegisterPassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("registerEye");


    if(password.type === "password"){

        password.type = "text";
        eye.textContent = "🙈";

    }else{

        password.type = "password";
        eye.textContent = "👁️";

    }

}


/* ==================== HIỆN / ẨN MẬT KHẨU ĐĂNG NHẬP ==================== */

function toggleLoginPassword(){

    const password =
        document.getElementById("loginPassword");

    const eye =
        document.getElementById("loginEye");


    if(password.type === "password"){

        password.type = "text";
        eye.textContent = "🙈";

    }else{

        password.type = "password";
        eye.textContent = "👁️";

    }

}

</script>

</body>
</html>
