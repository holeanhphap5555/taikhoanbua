<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinh nhật em yêu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#000}
section{position:fixed;inset:0}
.hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transition:1s}
#login{display:flex;align-items:center;justify-content:center;background:#fff;text-align:center}
.card{width:min(90%,390px)}
h1{font-size:clamp(22px,6vw,30px);margin:0 0 15px;color:#111}
.pic{width:190px;height:190px;object-fit:cover;border-radius:12px;display:block;margin:0 auto 14px}
.dots{height:30px}.dot{display:inline-block;width:9px;height:9px;border:1px solid #222;border-radius:50%;margin:5px 4px}.dot.on{background:#222}
.keys{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center}.key{height:52px;border:0;border-radius:9px;background:#f1f1f1;font-size:18px}.key:active{transform:scale(.94)}
#err{height:18px;color:#e85b82;font-size:12px;margin-top:7px;opacity:0}#err.on{opacity:1}
#matrix{display:flex;align-items:center;justify-content:center;background:#020203;color:#fff;z-index:3}
#rain{position:absolute;inset:0;width:100%;height:100%;opacity:.42}
#mt{position:relative;z-index:2;text-align:center;opacity:0;transform:scale(.96);transition:2s ease;text-shadow:0 0 18px rgba(190,110,255,.55)}
#mt.on{opacity:1;transform:scale(1)}
#mt small{display:block;font-size:10px;letter-spacing:5px;color:#bda8d8;margin-bottom:15px}
#mt strong{display:block;font-size:clamp(42px,12vw,100px);line-height:.95;font-weight:700;letter-spacing:2px}
#gift{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;z-index:2}
.gift{border:0;background:#f45a9e;color:#fff;border-radius:6px;padding:13px 32px;font-size:17px;font-weight:bold;box-shadow:0 8px 30px rgba(244,90,158,.25)}
#space{background:#000;opacity:0;visibility:hidden;z-index:1;overflow:hidden}#space.on{opacity:1;visibility:visible}
#space canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#label{position:absolute;z-index:5;bottom:7%;width:100%;text-align:center;color:#fff;opacity:0;transition:2s;text-shadow:0 0 18px #ff62d8;pointer-events:none}
#label.on{opacity:1}#label h2{font-size:clamp(27px,7vw,58px);font-weight:300;margin:0}#label p{font-size:10px;letter-spacing:3px}
@media(max-width:500px){.keys{grid-template-columns:repeat(3,64px)}.key{height:49px}.pic{width:180px;height:180px}}
</style>
</head>
<body>

<section id="login">
<div class="card">
<h1>NHẬP PASS ĐI NGƯỜI ĐẸP</h1>
<img class="pic" src="https://i.pravatar.cc/300?img=47">
<div class="dots" id="dots"></div>
<div class="keys">
<button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
<button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
<button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
<button class="key" id="del">×</button><button class="key" data-n="0">0</button><button class="key" id="ok">✓</button>
</div>
<div id="err">Mật khẩu chưa đúng</div>
</div>
</section>

<section id="matrix" class="hide">
<canvas id="rain"></canvas>
<div id="mt"><small>MỘT ĐIỀU ĐẶC BIỆT</small><strong>SINH NHẬT<br>EM YÊU</strong></div>
</section>

<section id="gift" class="hide">
<div>
<img class="pic" src="https://i.pravatar.cc/300?img=47">
<button class="gift" id="gb">Quà nè</button>
</div>
</section>

<section id="space">
<div id="label"><h2>Dành riêng cho em</h2><p>MỘT CHÚT VŨ TRỤ • MỘT CHÚT YÊU THƯƠNG</p></div>
</section>

<script>
const $=id=>document.getElementById(id);
const login=$('login'),matrix=$('matrix'),gift=$('gift'),space=$('space'),dots=$('dots'),err=$('err');
let pin='';
function drawDots(){dots.innerHTML=[0,1,2,3].map(i=>'<i class="dot '+(i<pin.length?'on':'')+'"></i>').join('')}
drawDots();

document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
 if(pin.length<4)pin+=b.dataset.n;
 drawDots();err.classList.remove('on');
});
$('del').onclick=()=>{pin=pin.slice(0,-1);drawDots();err.classList.remove('on')};

$('ok').onclick=()=>{
 if(pin!=='2601'){err.classList.add('on');return}
 login.classList.add('hide');
 matrix.classList.remove('hide');
 setTimeout(()=>$('mt').classList.add('on'),450);
 setTimeout(()=>{
   matrix.classList.add('hide');
   gift.classList.remove('hide');
 },4000);
};

const rainCanvas=$('rain'),ctx=rainCanvas.getContext('2d');
let drops=[],matrixChars='01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function resizeRain(){
 const d=Math.min(devicePixelRatio||1,2);
 rainCanvas.width=innerWidth*d;rainCanvas.height=innerHeight*d;
 rainCanvas.style.width=innerWidth+'px';rainCanvas.style.height=innerHeight+'px';
 ctx.setTransform(d,0,0,d,0,0);
 const count=Math.ceil(innerWidth/11);
 drops=Array.from({length:count},(_,i)=>({
   x:i*11+Math.random()*4,y:Math.random()*innerHeight-innerHeight*Math.random(),
   speed:.65+Math.random()*1.25,length:9+Math.floor(Math.random()*17),size:10+Math.random()*4
 }));
}
function gentleMatrix(){
 ctx.fillStyle='rgba(2,2,3,.095)';ctx.fillRect(0,0,innerWidth,innerHeight);
 ctx.textAlign='center';
 for(let i=0;i<drops.length;i++){
   const d=drops[i];ctx.font=d.size+'px monospace';
   for(let k=0;k<d.length;k++){
     const a=(1-k/d.length)*(.20+.18*Math.sin(i*.55));
     ctx.fillStyle=i%8===0?'rgba(235,190,255,'+Math.max(.08,a)+')':'rgba(140,85,190,'+Math.max(.04,a)+')';
     ctx.fillText(matrixChars[(Math.random()*matrixChars.length)|0],d.x,d.y-k*d.size*1.08);
   }
   d.y+=d.speed;
   if(d.y-d.length*d.size>innerHeight)d.y=-Math.random()*innerHeight*.4;
 }
 requestAnimationFrame(gentleMatrix);
}
resizeRain();gentleMatrix();addEventListener('resize',resizeRain);

$('gb').onclick=()=>{
 gift.classList.add('hide');
 space.classList.add('on');
 window.startGalaxy();
 setTimeout(()=>$('label').classList.add('on'),7000);
};
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

let started=false;
window.startGalaxy=function(){
 if(started)return;
 started=true;

 const scene=new THREE.Scene();
 scene.fog=new THREE.FogExp2(0x05000a,.006);

 const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);
 camera.position.set(0,1,27);

 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.setClearColor(0x020006,1);
 space.insertBefore(renderer.domElement,$('label'));

 scene.add(new THREE.AmbientLight(0x6c4c88,1.4));
 const pinkLight=new THREE.PointLight(0xff58d0,55,80);pinkLight.position.set(7,6,12);scene.add(pinkLight);
 const purpleLight=new THREE.PointLight(0x7755ff,35,90);purpleLight.position.set(-10,-4,8);scene.add(purpleLight);

 const starCount=innerWidth<600?10000:18000;
 const pos=new Float32Array(starCount*3);
 const colors=new Float32Array(starCount*3);
 for(let i=0;i<starCount;i++){
   const a=Math.random()*Math.PI*2;
   const radius=8+Math.pow(Math.random(),.62)*105;
   pos[i*3]=Math.cos(a)*radius;
   pos[i*3+1]=(Math.random()-.5)*(10+radius*.10);
   pos[i*3+2]=Math.sin(a)*radius-38;
   const col=new THREE.Color();
   col.setHSL(Math.random()>.55?.86:.63,.8,.62);
   colors[i*3]=col.r;colors[i*3+1]=col.g;colors[i*3+2]=col.b;
 }
 const starGeo=new THREE.BufferGeometry();
 starGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
 starGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
 const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({
   size:.48,vertexColors:true,transparent:true,opacity:.9,
   blending:THREE.AdditiveBlending,depthWrite:false
 }));
 scene.add(stars);

 const nebulaCount=innerWidth<600?2500:4500;
 const nebulaPos=new Float32Array(nebulaCount*3),nebulaCol=new Float32Array(nebulaCount*3);
 for(let i=0;i<nebulaCount;i++){
   const a=Math.random()*Math.PI*2,r=10+Math.random()*75;
   nebulaPos[i*3]=Math.cos(a)*r+(Math.random()-.5)*14;
   nebulaPos[i*3+1]=(Math.random()-.5)*22;
   nebulaPos[i*3+2]=Math.sin(a)*r-35;
   const nc=new THREE.Color().setHSL(Math.random()>.5?.91:.58,.85,.55);
   nebulaCol[i*3]=nc.r;nebulaCol[i*3+1]=nc.g;nebulaCol[i*3+2]=nc.b;
 }
 const nebulaGeo=new THREE.BufferGeometry();
 nebulaGeo.setAttribute('position',new THREE.BufferAttribute(nebulaPos,3));
 nebulaGeo.setAttribute('color',new THREE.BufferAttribute(nebulaCol,3));
 const nebula=new THREE.Points(nebulaGeo,new THREE.PointsMaterial({size:1.35,vertexColors:true,transparent:true,opacity:.10,blending:THREE.AdditiveBlending,depthWrite:false}));
 scene.add(nebula);

 const galaxy=new THREE.Group();
 scene.add(galaxy);

 const planet=new THREE.Mesh(
   new THREE.SphereGeometry(4.7,64,64),
   new THREE.MeshStandardMaterial({
     color:0xe08be8,roughness:.18,metalness:.08,
     emissive:0x6c176f,emissiveIntensity:.65
   })
 );
 galaxy.add(planet);

 const glow=new THREE.Mesh(
   new THREE.SphereGeometry(5.65,48,48),
   new THREE.MeshBasicMaterial({
     color:0xff62d7,transparent:true,opacity:.13,
     side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false
   })
 );
 galaxy.add(glow);

 const ring=new THREE.Mesh(
   new THREE.TorusGeometry(7.7,.065,10,220),
   new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9})
 );
 ring.rotation.set(1.05,.12,.1);
 galaxy.add(ring);

 const ring2=new THREE.Mesh(
   new THREE.TorusGeometry(8.5,.025,8,220),
   new THREE.MeshBasicMaterial({color:0xff8be3,transparent:true,opacity:.6})
 );
 ring2.rotation.copy(ring.rotation);
 galaxy.add(ring2);

 const orbitDot=new THREE.Mesh(
   new THREE.SphereGeometry(.42,20,20),
   new THREE.MeshBasicMaterial({color:0xffffff})
 );
 galaxy.add(orbitDot);

 const photoTexture=new THREE.TextureLoader().load('https://i.pravatar.cc/300?img=47');
 const photos=new THREE.Group();
 scene.add(photos);
 const photoData=[];
 const totalPhotos=innerWidth<600?80:140;
 for(let i=0;i<totalPhotos;i++){
   const layer=i%7;
   const angle=Math.random()*Math.PI*2;
   const radius=9+layer*3.3+Math.random()*7;
   const size=.75+Math.random()*1.45;
   const mesh=new THREE.Mesh(
     new THREE.PlaneGeometry(size,size),
     new THREE.MeshBasicMaterial({map:photoTexture,transparent:true,side:THREE.DoubleSide,opacity:.62+Math.random()*.32,depthWrite:false})
   );
   mesh.position.set(Math.cos(angle)*radius,(Math.random()-.5)*15,Math.sin(angle)*radius-14-Math.random()*28);
   photos.add(mesh);
   photoData.push({mesh,angle,radius,speed:.003+Math.random()*.008,phase:Math.random()*6.28,baseY:mesh.position.y,drift:Math.random()*.8});
 }

 let mx=0,my=0,tx=0,ty=0;
 addEventListener('mousemove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
 addEventListener('touchmove',e=>{
   if(e.touches[0]){tx=e.touches[0].clientX/innerWidth-.5;ty=e.touches[0].clientY/innerHeight-.5}
 },{passive:true});

 let time=0;
 function animate(){
   requestAnimationFrame(animate);
   time+=.009;
   const travel=Math.sin(time*.34)*3.5;
   camera.position.x+=(mx*5+Math.sin(time*.23)*2.8-camera.position.x)*.018;
   camera.position.y+=(1-my*3+Math.cos(time*.19)*1.3-camera.position.y)*.018;
   camera.position.z+=(27+travel-camera.position.z)*.012;
   camera.lookAt(Math.sin(time*.12)*1.8,Math.sin(time*.16)*.8,-6);

   galaxy.rotation.y+=.0028;
   planet.rotation.y+=.0018;
   ring.rotation.z+=.0035;
   ring2.rotation.z-=.002;
   stars.rotation.y+=.00055;
   nebula.rotation.y-=.00035;

   const a=time*1.65;
   orbitDot.position.set(Math.cos(a)*7.7,Math.sin(a)*1.9,Math.sin(a)*7.7);

   photoData.forEach(p=>{
     p.angle+=p.speed;
     p.mesh.position.x=Math.cos(p.angle)*p.radius;
     p.mesh.position.z=Math.sin(p.angle)*p.radius-14+Math.sin(time*.8+p.phase)*1.5;
     p.mesh.position.y=p.baseY+Math.sin(time*1.1+p.phase)*1.7;
     p.mesh.position.x+=Math.sin(time*.55+p.phase)*p.drift*.015;
     p.mesh.lookAt(camera.position);
   });

   renderer.render(scene,camera);
 }
 animate();

 addEventListener('resize',()=>{
   camera.aspect=innerWidth/innerHeight;
   camera.updateProjectionMatrix();
   renderer.setSize(innerWidth,innerHeight);
 });
};
</script>
</body>
</html>
