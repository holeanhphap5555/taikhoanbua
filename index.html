st.remove('hide');setTimeout(()=>$("mt").classList.add('on'),700);setTimeout(()=>{matrix.classList.add('hide');gift.classList.remove('hide')},3500)};const c=$("rain"),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();function rain(){x.fillStyle='rgba(0,0,0,.1)';x.fillRect(0,0,c.width,c.height);x.font='14px monospace';for(let i=0;i<innerWidth/15;i++){x.fillStyle=Math.random()>.85?'#fff':'#9b3cff';x.fillText('01ABCxyz#$'[Math.random()*11|0],i*15,Math.random()*innerHeight)}requestAnimationFrame(rain)}rain();addEventListener('resize',rs);$("gb").onclick=()=>{gift.classList.add('hide');space.classList.add('on');start3d();setTimeout(()=>$("label").classList.add('on'),8000)};</script><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';let run=0;function start3d(){if(run++)return;let s=new T.Scene,c=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,1500),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;space.appendChild(r.domElement);c.position.z=30;s.add(new T.AmbientLight(0x7650aa,.4));let l=new T.PointLight(0xff70d8,20,90);l.position.set(7,5,7);s.add(l);let n=innerWidth<600?4500:8500,p=new Float32Array(n*3),co=new Float32Array(n*3);for(let i=0;i<n;i++){let a=Math.random()*6.28,q=Math.pow(Math.random(),.6)*90;p[i*3]=Math.cos(a)*q;p[i*3+1]=(Math.random()-.5)*12;p[i*3+2]=Math.sin(a)*q;let z=new T.Color().setHSL(Math.random()>.5?.87:.58,.85,.65);co[i*3]=z.r;co[i*3+1]=z.g;co[i*3+2]=z.b}let G=new T.BufferGeometry;G.setAttribute('position',new T.BufferAttribute(p,3));G.setAttribute('color',new T.BufferAttribute(co,3));s.add(new T.Points(G,new T.PointsMaterial({size:.7,vertexColors:true,transparent:true,opacity:.9,blending:T.AdditiveBlending})));let g=new T.Group;s.add(g);g.add(new T.Mesh(new T.SphereGeometry(5.3,72,72),new T.MeshStandardMaterial({color:0xd989e9,roughness:.2,emissive:0x672
